<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="presentation">
  <defs>
    <linearGradient id="wddivider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="1000" y2="6" stroke="url(#wddivider)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="140 860">
    <animate attributeName="stroke-dashoffset" values="0;-2000" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="0" cy="6" r="3" fill="#ffffff" opacity="0">
    <animate attributeName="cx" values="0;1000" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>