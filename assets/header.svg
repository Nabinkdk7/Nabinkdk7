<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="280" viewBox="0 0 1080 280" role="img" aria-label="Nabin Khadka - Frontend and WordPress Developer">
  <defs>
    <linearGradient id="wdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c3b"><animate attributeName="stop-color" values="#0f0c3b;#13224f;#0f0c3b" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#191350"><animate attributeName="stop-color" values="#191350;#20205e;#191350" dur="11s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#0b2f3a"><animate attributeName="stop-color" values="#0b2f3a;#0e4452;#0b2f3a" dur="11s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="wdwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#7b2ff7;#00d9ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7b2ff7"><animate attributeName="stop-color" values="#7b2ff7;#00d9ff;#7b2ff7" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="wdglow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="280" fill="url(#wdbg)"/>
  <rect width="1080" height="280" fill="url(#wdglow)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0.5">
    <polygon points="-260,420 120,420 520,-40 140,-40" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="-900 0;900 0;-900 0" dur="6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="-260,380 100,380 480,-80 120,-80" fill="#00d9ff" opacity="0.25">
      <animateTransform attributeName="transform" type="translate" values="-900 0;900 0;-900 0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <path d="M0 226 C 200 196, 360 258, 560 242 S 920 206, 1080 232 L1080 280 L0 280 Z" fill="url(#wdwave)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -22 0; 0 0; 22 0; 0 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M0 252 C 240 226, 420 274, 640 258 S 920 230, 1080 254 L1080 280 L0 280 Z" fill="#00d9ff" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0 0; 20 0; 0 0; -20 0; 0 0" dur="4.5s" repeatCount="indefinite"/>
  </path>
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    <text x="540" y="116" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">Nabin Khadka</text>
  </g>
  <text x="540" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="600" fill="#00d9ff" text-anchor="middle" letter-spacing="5">
    FRONTEND &amp; WORDPRESS DEVELOPER
    <animate attributeName="opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.35s" fill="freeze"/>
    <line x1="415" y1="196" x2="665" y2="196" stroke="url(#wdwave)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 190">
      <animate attributeName="stroke-dashoffset" values="0;-500" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="180" cy="120" r="3.5" fill="#00d9ff" opacity="0.8">
    <animate attributeName="cy" values="105;150;105" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="150" r="3" fill="#7b2ff7" opacity="0.9">
    <animate attributeName="cy" values="135;175;135" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="60" r="2.5" fill="#ffffff" opacity="0.6">
    <animate attributeName="cy" values="50;85;50" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="70" r="3" fill="#00d9ff" opacity="0.6">
    <animate attributeName="cy" values="60;98;60" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="220" r="2.5" fill="#ffffff" opacity="0.5">
    <animate attributeName="cx" values="505;535;505" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>