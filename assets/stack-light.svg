      <circle cx="754" cy="118" r="2.6" fill="#0891B2"/><text x="770" y="123">Git</text>
      <circle cx="754" cy="162" r="2.6" fill="#0891B2"/><text x="770" y="167">GitHub</text>
      <circle cx="754" cy="206" r="2.6" fill="#0891B2"/><text x="770" y="211">VS Code</text>
      <circle cx="754" cy="250" r="2.6" fill="#0891B2"/><text x="770" y="255">Chrome DevTools</text>
    </g>
    <text x="1004" y="123" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94A3B8">03</text>
