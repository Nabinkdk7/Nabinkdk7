<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-label="Tech stack: WordPress, Elementor, ACF, Divi Builder, HTML, CSS, JavaScript, Responsive Design, Git, GitHub, VS Code, Chrome DevTools">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.05s" fill="freeze"/>
    <rect x="48" y="24" width="312" height="292" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="48" y="24" width="72" height="2" rx="1" fill="url(#accentL)" opacity="0.9"/>
    <text x="76" y="70" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0E7490" letter-spacing="2.4">WORDPRESS &amp; ECOSYSTEM</text>
    <line x1="76" y1="86" x2="332" y2="86" stroke="#E2E8F0"/>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#334155">
      <circle cx="82" cy="118" r="2.6" fill="#0891B2"/><text x="98" y="123">WordPress</text>
      <circle cx="82" cy="162" r="2.6" fill="#0891B2"/><text x="98" y="167">Elementor</text>
      <circle cx="82" cy="206" r="2.6" fill="#0891B2"/><text x="98" y="211">ACF</text>
      <circle cx="82" cy="250" r="2.6" fill="#0891B2"/><text x="98" y="255">Divi Builder</text>
    </g>
    <text x="332" y="123" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94A3B8">01</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.2s" fill="freeze"/>
    <rect x="384" y="24" width="312" height="292" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="384" y="24" width="72" height="2" rx="1" fill="url(#accentL)" opacity="0.9"/>
    <text x="412" y="70" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0E7490" letter-spacing="2.4">FRONTEND</text>
    <line x1="412" y1="86" x2="668" y2="86" stroke="#E2E8F0"/>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#334155">
      <circle cx="418" cy="118" r="2.6" fill="#0891B2"/><text x="434" y="123">HTML</text>
      <circle cx="418" cy="162" r="2.6" fill="#0891B2"/><text x="434" y="167">CSS</text>
      <circle cx="418" cy="206" r="2.6" fill="#0891B2"/><text x="434" y="211">JavaScript</text>
      <circle cx="418" cy="250" r="2.6" fill="#0891B2"/><text x="434" y="255">Responsive Design</text>
    </g>
    <text x="668" y="123" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#94A3B8">02</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.35s" fill="freeze"/>
    <rect x="720" y="24" width="312" height="292" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="720" y="24" width="72" height="2" rx="1" fill="url(#accentL)" opacity="0.9"/>
    <text x="748" y="70" font-family="Consolas, Menlo, monospace" font-size="12" fill="#0E7490" letter-spacing="2.4">TOOLS</text>
