<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-label="Nabin Khadka - WordPress Developer, animated developer console">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0A1626"/>
    </linearGradient>
    <linearGradient id="haccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"><animate attributeName="stop-color" values="#00D9FF;#7B2FF7;#00D9FF" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#7B2FF7"><animate attributeName="stop-color" values="#7B2FF7;#00D9FF;#7B2FF7" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="hname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#7FEBFF"/>
      <stop offset="0.75" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <radialGradient id="hauroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hauroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#7FEBFF" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <filter id="hglow" x="-40%" y="-60%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="hl1"><rect x="612" y="108" width="0" height="26"><animate attributeName="width" values="0;390" dur="0.85s" begin="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="hl2"><rect x="612" y="136" width="0" height="26"><animate attributeName="width" values="0;390" dur="0.85s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="hl3"><rect x="612" y="164" width="0" height="26"><animate attributeName="width" values="0;390" dur="0.85s" begin="3s" fill="freeze"/></rect></clipPath>
    <clipPath id="hl4"><rect x="612" y="192" width="0" height="26"><animate attributeName="width" values="0;390" dur="0.85s" begin="4.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="hl5"><rect x="612" y="220" width="0" height="26"><animate attributeName="width" values="0;390" dur="0.85s" begin="5.2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1080" height="360" fill="url(#hbg)"/>
  <rect width="1080" height="360" fill="url(#hgrid)"/>

  <g filter="url(#hsoft)">
    <circle cx="180" cy="90" r="130" fill="url(#hauroraA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 30;0 0;-40 10;0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="270" r="150" fill="url(#hauroraB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;0 0;50 -10;0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
    <text x="60" y="86" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7FEBFF" letter-spacing="2">// WORDPRESS DEVELOPER</text>
    <text x="60" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#hname)" filter="url(#hglow)" letter-spacing="0.5">Nabin Khadka</text>
    <text x="60" y="196" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" opacity="0.92">WordPress · Elementor · ACF · Divi Builder</text>
    <text x="60" y="226" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8B949E">HTML · CSS · JavaScript · Responsive Web Design</text>

    <line x1="60" y1="246" x2="300" y2="246" stroke="url(#haccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 190">
      <animate attributeName="stroke-dashoffset" values="0;-520" dur="4s" repeatCount="indefinite"/>
    </line>

    <g transform="translate(60, 266)">
      <rect width="236" height="38" rx="19" fill="#0E1A22" stroke="#1F3A44"/>
      <circle cx="22" cy="19" r="5" fill="#2ECC71">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;6;4.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="22" cy="19" r="9" fill="none" stroke="#2ECC71" stroke-width="1">
        <animate attributeName="r" values="6;13" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="24" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7FF0B8" letter-spacing="1.2">OPEN TO REMOTE WORK</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 5;0 0" dur="7s" repeatCount="indefinite"/>
    <rect x="596" y="56" width="424" height="252" rx="14" fill="#0C1118" stroke="#243043"/>
    <rect x="596" y="56" width="424" height="36" rx="14" fill="#111823"/>
    <rect x="596" y="78" width="424" height="14" fill="#111823"/>
    <line x1="596" y1="92" x2="1020" y2="92" stroke="#243043"/>

    <circle cx="618" cy="74" r="5.5" fill="#FF5F56"/>
    <circle cx="636" cy="74" r="5.5" fill="#FFBD2E"/>
    <circle cx="654" cy="74" r="5.5" fill="#27C93F"/>

    <text x="1002" y="78" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#5B6B82">zsh — nabin@dev</text>

    <g font-family="Consolas, Menlo, monospace" font-size="13.5" letter-spacing="0.2">
      <g clip-path="url(#hl1)">
        <text x="612" y="128" fill="#7FEBFF">$ whoami</text>
        <text x="736" y="128" fill="#E6EDF3">→ nabin_khadka</text>
      </g>
      <g clip-path="url(#hl2)">
        <text x="612" y="156" fill="#7FEBFF">$ stack --current</text>
        <text x="786" y="156" fill="#C9D1D9">wordpress · elementor · acf</text>
      </g>
      <g clip-path="url(#hl3)">
        <text x="612" y="184" fill="#7FEBFF">$ location</text>
        <text x="736" y="184" fill="#C9D1D9">tehrathum, nepal</text>
      </g>
      <g clip-path="url(#hl4)">
        <text x="612" y="212" fill="#7FEBFF">$ focus</text>
        <text x="704" y="212" fill="#C9D1D9">responsive wordpress sites</text>
      </g>
      <g clip-path="url(#hl5)">
        <text x="612" y="240" fill="#7FEBFF">$ status</text>
        <text x="736" y="240" fill="#7FF0B8">● shipping, open to work</text>
      </g>
    </g>

    <text x="612" y="272" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#7FEBFF">$</text>
    <rect x="628" y="260" width="9" height="16" fill="#00D9FF">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke="#25344A">
    <path d="M520 40 L560 40 L560 80" opacity="0.5"/>
    <path d="M560 300 L520 300 L520 260" opacity="0.5"/>
    <circle cx="560" cy="40" r="3" fill="#00D9FF" stroke="none"/>
    <circle cx="560" cy="300" r="3" fill="#7B2FF7" stroke="none"/>
  </g>

  <g opacity="0.75">
    <circle cx="345" cy="70" r="2.4" fill="#00D9FF">
      <animate attributeName="cy" values="60;96;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.1;0.75" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="300" r="2" fill="#FFFFFF">
      <animate attributeName="cy" values="288;318;288" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="180" r="2.6" fill="#7B2FF7">
      <animate attributeName="cy" values="165;205;165" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="5.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
