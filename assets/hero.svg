<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="336" viewBox="0 48 1080 336" role="img" aria-label="Nabin Khadka - WordPress Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A11"/>
      <stop offset="0.55" stop-color="#0A101B"/>
      <stop offset="1" stop-color="#0B1320"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#E2F8FF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.6" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="nameGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="t1"><rect x="640" y="146" width="0" height="24"><animate attributeName="width" values="0;330" dur="0.8s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="640" y="174" width="0" height="24"><animate attributeName="width" values="0;330" dur="0.8s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="640" y="202" width="0" height="24"><animate attributeName="width" values="0;330" dur="0.8s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="640" y="230" width="0" height="24"><animate attributeName="width" values="0;330" dur="0.8s" begin="3.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1080" height="400" fill="url(#bg)"/>
  <rect width="1080" height="400" fill="url(#grid)"/>

  <g filter="url(#soft)">
    <circle cx="120" cy="40" r="170" fill="url(#glowCyan)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 25;0 0;-25 10;0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="360" r="190" fill="url(#glowViolet)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 -25;0 0;25 -5;0 0" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>

    <g transform="translate(64, 88)">
      <line x1="0" y1="-4" x2="22" y2="-4" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="0" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7DD3FC" letter-spacing="3">WORDPRESS DEVELOPER</text>
    </g>

    <text x="62" y="182" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#nameFill)" letter-spacing="-0.5" filter="url(#nameGlow)">Nabin Khadka</text>

    <line x1="64" y1="206" x2="124" y2="206" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <text x="64" y="242" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#CBD5E1">WordPress · Elementor · ACF · Divi Builder</text>
    <text x="64" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7C8B9F">HTML · CSS · JavaScript · Responsive Web Design</text>

    <g transform="translate(64, 300)">
      <rect width="224" height="36" rx="18" fill="#0B141D" stroke="#17303C"/>
      <circle cx="21" cy="18" r="4.5" fill="#34D399">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="21" cy="18" r="8" fill="none" stroke="#34D399" stroke-width="0.8">
        <animate attributeName="r" values="5;12" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="23" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#86EFAC" letter-spacing="1.6">OPEN TO REMOTE WORK</text>
    </g>
  </g>

  <g>
    <rect x="588" y="76" width="432" height="252" rx="16" fill="#0A111A" opacity="0.94"/>
    <rect x="588.5" y="76.5" width="431" height="251" rx="15.5" fill="none" stroke="url(#edge)" stroke-width="1"/>
    <line x1="588" y1="120" x2="1020" y2="120" stroke="#16202E"/>

    <circle cx="612" cy="98" r="4.5" fill="#334155"/>
    <circle cx="628" cy="98" r="4.5" fill="#334155"/>
    <circle cx="644" cy="98" r="4.5" fill="#334155"/>

    <text x="1002" y="102" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#475569" letter-spacing="1">nabin@dev</text>

    <g font-family="Consolas, Menlo, monospace" font-size="13" letter-spacing="0.2">
      <text x="612" y="141" fill="#314155">1</text>
      <g clip-path="url(#t1)">
        <text x="640" y="164" fill="#67E8F9">$ whoami</text>
        <text x="756" y="164" fill="#E2E8F0">nabin_khadka</text>
      </g>

      <text x="612" y="169" fill="#314155">2</text>
      <g clip-path="url(#t2)">
        <text x="640" y="192" fill="#67E8F9">$ stack</text>
        <text x="740" y="192" fill="#CBD5E1">wordpress · elementor · acf</text>
      </g>

      <text x="612" y="197" fill="#314155">3</text>
      <g clip-path="url(#t3)">
        <text x="640" y="220" fill="#67E8F9">$ location</text>
        <text x="770" y="220" fill="#CBD5E1">tehrathum, nepal</text>
      </g>

      <text x="612" y="225" fill="#314155">4</text>
      <g clip-path="url(#t4)">
        <text x="640" y="248" fill="#67E8F9">$ focus</text>
        <text x="722" y="248" fill="#CBD5E1">responsive wordpress sites</text>
      </g>
    </g>

    <text x="612" y="296" font-family="Consolas, Menlo, monospace" font-size="13" fill="#67E8F9">$</text>
    <rect x="628" y="284" width="8" height="15" rx="1" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="64" y1="368" x2="1016" y2="368" stroke="#101C2A" stroke-width="1"/>
  <g opacity="0.8">
    <circle cx="64" cy="368" r="2" fill="#22D3EE"/>
    <circle cx="1016" cy="368" r="2" fill="#8B5CF6"/>
  </g>
</svg>
